<section class="wrap grid" style="--min:420px;--g:48px;align-items:start;padding-top:clamp(24px,5vw,64px);padding-bottom:var(--sec)">
  <div class="stack" style="--g:16px"><div class="stack" style="--g:14px;max-width:760px"><span class="kicker">Contact</span><h1 class="h1" style="font-size:clamp(40px,5.6vw,72px)">Questions? We're happy to help.</h1><p class="lead">Ask about team cards, designs or anything else. We reply within one business day.</p></div><a href="mailto:hello@linkcardly.com" style="font-weight:700;font-size:17px">hello@linkcardly.com</a></div>
  <div><div data-contact-done hidden class="panel stack" style="--g:10px"><strong style="font:400 28px var(--font-h)">Thanks, <span data-cname></span>. Message received.</strong><span>We'll reply within one business day.</span></div>
  <form id="contact" class="panel stack" style="--g:14px" novalidate><label class="field">Name<input class="input" name="name" type="text" placeholder="Your name" required></label><label class="field">Email<input class="input" name="email" type="email" placeholder="you@company.com" required></label><label class="field">Phone (optional)<input class="input" name="phone" type="tel" placeholder="+1 402 555 0187"></label><label class="field">How can we help?<textarea class="input" name="message" rows="4" placeholder="Tell us a little about what you need" required></textarea></label><div class="cf-turnstile" data-sitekey="{{TURNSTILE_SITE_KEY}}"></div><div class="row" style="--g:12px"><button class="btn btn-accent btn-lg" type="submit">Send message</button><span class="status bad" data-contact-msg style="padding:0"></span></div></form></div>
</section>

name = "linkcardly"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Builds site/ → public/ and generated helpers before every `wrangler dev` / `wrangler deploy`.
[build]
command = "node scripts/build.mjs"

# Workers Logs: the Worker writes one JSON line per request and per error (see src/index.js).
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# /designs is served directly (matching canonical URLs and the sitemap); /designs/ redirects to it.
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = true

[vars]
SITE_URL = "https://linkcardly.com"

# /create embeds the existing NexBizRise order flow unchanged (src in public/create/index.html).

# PHASE 1 — proxy mode (default). Linkcardly serves its own marketing pages,
# and forwards /api/* and every card page to the existing NexBizRise worker,
# so the current Supabase project, Turnstile, payments, admin and edit links
# keep working with their existing credentials. Nothing is duplicated.
MODE = "proxy"
LEGACY_ORIGIN = "https://card.nexbizrise.com"

# PHASE 2 — native mode. Set MODE = "native", fill these, run the migration,
# then set LEGACY_HOSTS so old card.nexbizrise.com links 301 to linkcardly.com.
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
# Public site key for the native lead form. Must match TURNSTILE_SECRET. Proxy mode uses the
# NexBizRise widget (site/site.config.js), whose secret lives in the NexBizRise worker.
TURNSTILE_SITE_KEY = "0x4AAAAAAFIAJl64rp47Hazn"
LEGACY_HOSTS = ""

# Secrets for native mode (wrangler secret put …):
# SUPABASE_SERVICE_KEY
# TURNSTILE_SECRET
# SUPABASE_ANON_KEY   (optional: public card reads then go through RLS instead of the service key)

# Per-IP rate limit on /api/* writes and handle checks (src/index.js). 30 requests / 60 s per IP and route.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Staging (DEF-40): `npx wrangler deploy --env staging` → linkcardly-staging.<account>.workers.dev.
# Vars and rate limits are not inherited by environments, so they are repeated here. Staging stays in
# proxy mode against the same NexBizRise worker; test orders there use the payment providers' test mode
# only if NexBizRise is pointed at test keys. Its workers.dev hostname must be in the Turnstile widget.
[env.staging]
name = "linkcardly-staging"

[env.staging.vars]
# Set to the real workers.dev URL printed by the first `wrangler deploy --env staging`.
SITE_URL = "https://linkcardly-staging.YOUR-SUBDOMAIN.workers.dev"
MODE = "proxy"
LEGACY_ORIGIN = "https://card.nexbizrise.com"
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
TURNSTILE_SITE_KEY = "0x4AAAAAAFIAJl64rp47Hazn"
LEGACY_HOSTS = ""

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Pull-request previews (Cloudflare Workers Builds runs `wrangler preview` on every PR branch).
# Like environments, previews don't inherit vars or rate limits. Previews stay in proxy mode against the
# NexBizRise worker; links that need an absolute URL (redirects, vCards, share links) point at production.
[previews.vars]
SITE_URL = "https://linkcardly.com"
MODE = "proxy"
LEGACY_ORIGIN = "https://card.nexbizrise.com"
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
TURNSTILE_SITE_KEY = "0x4AAAAAAFIAJl64rp47Hazn"
LEGACY_HOSTS = ""

[[previews.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

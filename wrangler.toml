name = "linkcardly"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Builds site/ → public/ and generated helpers before every `wrangler dev` / `wrangler deploy`.
[build]
command = "node scripts/build.mjs"

# Workers Logs: the Worker writes one JSON line per request and per error (see src/index.js).
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# /designs is served directly (matching canonical URLs and the sitemap); /designs/ redirects to it.
html_handling = "drop-trailing-slash"
not_found_handling = "none"
run_worker_first = true

[vars]
SITE_URL = "https://linkcardly.com"

# Proxy mode (today): Linkcardly serves its own pages and forwards /api/* to the old NexBizRise worker, which
# still does ordering, uploads, edits and payments with its own keys. The values below are Linkcardly's own
# and are only used once MODE = "native" (cutover day, see docs/ARCHITECTURE.md). Nothing here is secret.
MODE = "proxy"
LEGACY_ORIGIN = "https://card.nexbizrise.com"
LEGACY_HOSTS = ""

# Linkcardly's own Supabase project (linkcardly-prod). The publishable key is public by design.
SUPABASE_URL = "https://iqqxitntkcmrcvuqxxex.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_BB6t10anvceY7vy5VXkN6w_7-LGJXUC"
# Turnstile widget "Linkcardly" (covers linkcardly.com and its subdomains). Its secret is TURNSTILE_SECRET.
TURNSTILE_SITE_KEY = "0x4AAAAAAFNHrxM63OpIlzd5"
# Card photos: R2 bucket linkcardly-photos (binding PHOTOS below), served at this address.
IMG_BASE = "https://img.linkcardly.com"
# Cloudflare account, for reading visit counts (Analytics Engine) with CF_ANALYTICS_TOKEN.
CF_ACCOUNT_ID = "56bb7259aae8956fc8e82826ee95e7cb"
STATS_DATASET = "linkcardly_stats"
# Emails (Resend, RESEND_API_KEY): sent from MAIL_FROM; replies, new-order and enquiry emails go to ADMIN_EMAIL.
MAIL_FROM = "Linkcardly <hello@linkcardly.com>"
ADMIN_EMAIL = "hello@linkcardly.com"

# Secrets (set in the dashboard or with `npx wrangler secret put <NAME>`, never in this file):
#   SUPABASE_SERVICE_KEY  WORKER_SECRET  CRON_KEY  TURNSTILE_SECRET  CF_ANALYTICS_TOKEN  RESEND_API_KEY
#   later: RAZORPAY_KEY_ID  RAZORPAY_KEY_SECRET  RAZORPAY_WEBHOOK_SECRET  (STRIPE_SECRET_KEY  STRIPE_WEBHOOK_SECRET)
# Production has all six of the first line (set 2026-10-03).

# Daily job at 03:30 UTC (09:00 India): renewal reminders. It also queries the database every day, which keeps a
# Supabase Free project from pausing for inactivity. Runs in both modes (src/routes/native.js `scheduled`).
[triggers]
crons = ["30 3 * * *"]

# Card photos and visit counts.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "linkcardly-photos"

[[analytics_engine_datasets]]
binding = "STATS"
dataset = "linkcardly_stats"

# Per-IP rate limit on /api/* writes and handle checks (src/index.js). 30 requests / 60 s per IP and route.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Staging: `npx wrangler deploy --env staging` → linkcardly-staging.yourlocalwebsitedev.workers.dev.
# Vars, bindings and rate limits are not inherited by environments, so they are repeated here. Staging has its
# own Supabase project (linkcardly-staging, test mode on), photo bucket, Turnstile widget and secrets.
[env.staging]
name = "linkcardly-staging"

[env.staging.vars]
SITE_URL = "https://linkcardly-staging.yourlocalwebsitedev.workers.dev"
# Staging runs the native API (its own database, bucket, widget, emails) so it can be tested before cutover.
MODE = "native"
LEGACY_ORIGIN = "https://card.nexbizrise.com"
LEGACY_HOSTS = ""
SUPABASE_URL = "https://ctzoyorugnybzvkoyvwj.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_EYwRSCPgTjV7FX6WOrmzDg_PRbMTNSY"
TURNSTILE_SITE_KEY = "0x4AAAAAAFNHwEXiZ92pCaRo"
IMG_BASE = "https://img-staging.linkcardly.com"
CF_ACCOUNT_ID = "56bb7259aae8956fc8e82826ee95e7cb"
STATS_DATASET = "linkcardly_stats_staging"
MAIL_FROM = "Linkcardly staging <hello@linkcardly.com>"
ADMIN_EMAIL = "hello@linkcardly.com"

[env.staging.triggers]
crons = ["30 3 * * *"]

[[env.staging.r2_buckets]]
binding = "PHOTOS"
bucket_name = "linkcardly-photos-staging"

[[env.staging.analytics_engine_datasets]]
binding = "STATS"
dataset = "linkcardly_stats_staging"

[[env.staging.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Pull-request previews (Cloudflare Workers Builds runs `wrangler preview` on every PR branch).
# Like environments, previews don't inherit vars or rate limits. Previews stay in proxy mode against the
# NexBizRise worker and use staging's database settings; links that need an absolute URL (redirects, vCards, share links) point at production.
[previews.vars]
SITE_URL = "https://linkcardly.com"
MODE = "proxy"
LEGACY_ORIGIN = "https://card.nexbizrise.com"
LEGACY_HOSTS = ""
SUPABASE_URL = "https://ctzoyorugnybzvkoyvwj.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_EYwRSCPgTjV7FX6WOrmzDg_PRbMTNSY"
TURNSTILE_SITE_KEY = "0x4AAAAAAFNHwEXiZ92pCaRo"
IMG_BASE = "https://img-staging.linkcardly.com"
CF_ACCOUNT_ID = "56bb7259aae8956fc8e82826ee95e7cb"
STATS_DATASET = "linkcardly_stats_staging"

[[previews.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging:
        description: Deploy this branch to staging after the checks pass
        type: boolean
        default: false
      deploy:
        description: Deploy to production after the checks pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Bundle check (production and staging)
        run: |
          npx wrangler deploy --dry-run --outdir dist
          npx wrangler deploy --dry-run --env staging --outdir dist-staging

  # Every push to main goes to staging, and any branch can be sent there by hand (Actions → CI → Run
  # workflow → pick the branch → tick "staging"). Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
  # repository secrets (token: "Edit Cloudflare Workers"); skipped until they exist.
  staging:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.staging)
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to staging
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --env staging
      - name: Smoke check
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.STAGING_URL != ''
        run: curl -fsS "${{ vars.STAGING_URL }}/health?deep=1"

  # Production deploys only by hand (Actions → CI → Run workflow → deploy), from main, after the
  # checks pass. Add required reviewers to the "production" environment in the repository settings.
  production:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
      - run: curl -fsS "https://linkcardly.com/health?deep=1"
